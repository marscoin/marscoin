name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-cli-build:
    name: Linux CLI Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            automake \
            libtool \
            autotools-dev \
            pkg-config \
            python3 \
            libevent-dev \
            libboost-dev \
            libsqlite3-dev \
            libssl-dev \
            libminiupnpc-dev \
            libnatpmp-dev

      - name: Configure
        run: |
          ./autogen.sh
          ./configure --without-gui --disable-tests --disable-bench

      - name: Build
        run: make -j"$(nproc)"

      - name: Smoke check
        run: |
          ./src/marscoind --version
          ./src/marscoin-cli --version

  linux-marsqnet-randomx-smoke:
    name: Linux marsqnet RandomX Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            automake \
            libtool \
            autotools-dev \
            pkg-config \
            python3 \
            libevent-dev \
            libboost-dev \
            libsqlite3-dev \
            libssl-dev \
            libminiupnpc-dev \
            libnatpmp-dev

      - name: Configure
        run: |
          ./autogen.sh
          ./configure --without-gui --disable-tests --disable-bench --enable-randomx-vendor

      - name: Build
        run: |
          make -j"$(nproc)" src/marscoind
          make -j"$(nproc)" src/marscoin-cli

      - name: Run marsqnet smoke
        env:
          DATADIR_BASE: ${{ runner.temp }}/marsqnet-smoke
          BLOCKS: "2"
          TIMEOUT_SEC: "60"
        run: contrib/devtools/marsqnet-randomx-smoke.sh

      - name: Upload marsqnet logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: marsqnet-smoke-logs
          path: ${{ runner.temp }}/marsqnet-smoke

  macos-arm64-gui-build:
    name: macOS ARM64 GUI Build
    runs-on: macos-14
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install automake libtool boost pkg-config libevent openssl@3 qt@5 miniupnpc

      - name: Configure
        run: |
          PATH="$(brew --prefix qt@5)/bin:$PATH" \
          CPPFLAGS="-I$(brew --prefix openssl@3)/include" \
          LDFLAGS="-L$(brew --prefix openssl@3)/lib" \
          ./autogen.sh
          PATH="$(brew --prefix qt@5)/bin:$PATH" \
          CPPFLAGS="-I$(brew --prefix openssl@3)/include" \
          LDFLAGS="-L$(brew --prefix openssl@3)/lib" \
          ./configure --with-gui=yes --disable-tests --disable-bench

      - name: Build
        run: |
          make -j"$(sysctl -n hw.ncpu)" src/marscoind
          make -j"$(sysctl -n hw.ncpu)" src/marscoin-cli
          make -j"$(sysctl -n hw.ncpu)" src/qt/marscoin-qt

      - name: Smoke check
        run: |
          ./src/qt/marscoin-qt -version
          ./src/marscoind --version
          ./src/marscoin-cli --version

  linux-pq-oqs-signature-kat:
    name: Linux PQ OQS Signature KAT
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            automake \
            libtool \
            autotools-dev \
            pkg-config \
            python3 \
            cmake \
            libevent-dev \
            libboost-dev \
            libsqlite3-dev \
            libssl-dev \
            libminiupnpc-dev \
            libnatpmp-dev

      - name: Build vendored liboqs
        run: |
          OQS_BUILD_PARALLEL=2 ./src/crypto/oqs_vendor/build-liboqs-vendor.sh

      - name: Configure
        run: |
          ./autogen.sh
          ./configure --without-gui --disable-tests --disable-bench --enable-pq-oqs-vendor

      - name: Build CLI
        run: |
          make -j"$(nproc)" src/marscoin-cli

      - name: Run SPHINCS OQS KAT
        run: |
          ./contrib/devtools/oqs-sphincs-kat.sh

  linux-pq-boost-tests:
    name: Linux PQ Boost Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            automake \
            libtool \
            autotools-dev \
            pkg-config \
            python3 \
            cmake \
            libevent-dev \
            libboost-dev \
            libboost-test-dev \
            libsqlite3-dev \
            libssl-dev \
            libminiupnpc-dev \
            libnatpmp-dev

      - name: Build vendored liboqs
        run: |
          OQS_BUILD_PARALLEL=2 ./src/crypto/oqs_vendor/build-liboqs-vendor.sh

      - name: Configure
        run: |
          ./autogen.sh
          ./configure --without-gui --disable-bench --enable-pq-oqs-vendor

      - name: Build
        run: |
          make -j"$(nproc)"

      - name: Run PQ crypto tests
        run: |
          ./src/test/test_marscoin --run_test=crypto_tests/pq_sphincs_signature_scaffold
