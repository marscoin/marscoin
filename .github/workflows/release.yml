name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-macos:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
            gui: "no"
          - os: macos-15-intel
            target: macos-x86_64
            gui: "yes"
          - os: macos-14
            target: macos-arm64
            gui: "yes"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            automake \
            libtool \
            autotools-dev \
            pkg-config \
            python3 \
            libevent-dev \
            libboost-dev \
            libsqlite3-dev \
            libssl-dev \
            libminiupnpc-dev \
            libnatpmp-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install automake libtool boost pkg-config libevent openssl@3 qt@5 miniupnpc

      - name: Configure
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            PATH="$(brew --prefix qt@5)/bin:$PATH" \
            CPPFLAGS="-I$(brew --prefix openssl@3)/include" \
            LDFLAGS="-L$(brew --prefix openssl@3)/lib" \
            ./autogen.sh
            PATH="$(brew --prefix qt@5)/bin:$PATH" \
            CPPFLAGS="-I$(brew --prefix openssl@3)/include" \
            LDFLAGS="-L$(brew --prefix openssl@3)/lib" \
            ./configure --with-gui=${{ matrix.gui }} --disable-tests --disable-bench
          else
            ./autogen.sh
            ./configure --with-gui=${{ matrix.gui }} --disable-tests --disable-bench
          fi

      - name: Build
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            make -j"$(sysctl -n hw.ncpu)" src/marscoind
            make -j"$(sysctl -n hw.ncpu)" src/marscoin-cli
            make -j"$(sysctl -n hw.ncpu)" src/marscoin-tx
            make -j"$(sysctl -n hw.ncpu)" src/marscoin-util
            make -j"$(sysctl -n hw.ncpu)" src/qt/marscoin-qt
          else
            make -j"$(nproc)" src/marscoind
            make -j"$(nproc)" src/marscoin-cli
            make -j"$(nproc)" src/marscoin-tx
            make -j"$(nproc)" src/marscoin-util
          fi

      - name: Package artifacts
        run: |
          mkdir -p dist/bin
          cp src/marscoind dist/bin/
          cp src/marscoin-cli dist/bin/
          cp src/marscoin-tx dist/bin/
          cp src/marscoin-util dist/bin/
          if [ "${{ matrix.gui }}" = "yes" ]; then
            cp src/qt/marscoin-qt dist/bin/
          fi
          tar -czf "marscoin-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" -C dist bin

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: marscoin-${{ github.ref_name }}-${{ matrix.target }}
          path: marscoin-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  build-windows:
    name: Build windows-x86_64
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-libevent
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-miniupnpc
            mingw-w64-x86_64-python
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-qrencode

      - name: Configure and build
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/qt5/bin:/mingw64/lib/qt5/bin:/mingw64/bin:$PATH"
          MOC_BIN="$(command -v moc-qt5 || command -v moc || true)"
          if [ -z "$MOC_BIN" ] && [ -x /mingw64/qt5/bin/moc.exe ]; then
            MOC_BIN="/mingw64/qt5/bin/moc.exe"
          fi
          if [ -z "$MOC_BIN" ] && [ -x /mingw64/lib/qt5/bin/moc.exe ]; then
            MOC_BIN="/mingw64/lib/qt5/bin/moc.exe"
          fi
          UIC_BIN="$(command -v uic-qt5 || command -v uic5 || command -v uic || true)"
          if [ -z "$UIC_BIN" ] && [ -x /mingw64/qt5/bin/uic.exe ]; then
            UIC_BIN="/mingw64/qt5/bin/uic.exe"
          fi
          if [ -z "$UIC_BIN" ] && [ -x /mingw64/lib/qt5/bin/uic.exe ]; then
            UIC_BIN="/mingw64/lib/qt5/bin/uic.exe"
          fi
          ./autogen.sh
          LIBS="-lcrypt32" MOC="$MOC_BIN" UIC="$UIC_BIN" ./configure --with-gui=yes --disable-tests --disable-bench
          LIBS="-lcrypt32" make -j"$(nproc)" src/marscoind.exe
          LIBS="-lcrypt32" make -j"$(nproc)" src/marscoin-cli.exe
          LIBS="-lcrypt32" make -j"$(nproc)" src/marscoin-tx.exe
          LIBS="-lcrypt32" make -j"$(nproc)" src/marscoin-util.exe
          LIBS="-lcrypt32" make -j"$(nproc)" src/qt/marscoin-qt.exe

      - name: Package artifacts
        shell: msys2 {0}
        run: |
          mkdir -p dist/bin
          cp src/marscoind.exe dist/bin/
          cp src/marscoin-cli.exe dist/bin/
          cp src/marscoin-tx.exe dist/bin/
          cp src/marscoin-util.exe dist/bin/
          cp src/qt/marscoin-qt.exe dist/bin/
          tar -czf "marscoin-${{ github.ref_name }}-windows-x86_64.tar.gz" -C dist bin

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: marscoin-${{ github.ref_name }}-windows-x86_64
          path: marscoin-${{ github.ref_name }}-windows-x86_64.tar.gz

  checksums:
    name: Generate checksums
    runs-on: ubuntu-24.04
    needs:
      - build-linux-macos
      - build-windows

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Generate SHA256SUMS
        run: |
          find release-assets -name "*.tar.gz" -type f -print0 | xargs -0 sha256sum > SHA256SUMS

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: marscoin-${{ github.ref_name }}-checksums
          path: SHA256SUMS

  publish:
    name: Publish GitHub Release Assets
    runs-on: ubuntu-24.04
    needs:
      - build-linux-macos
      - build-windows
      - checksums
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.tar.gz
            release-assets/**/SHA256SUMS
