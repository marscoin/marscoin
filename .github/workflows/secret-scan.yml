name: Secret scan

# Fails if a commit adds something that looks like a credential.
# Pushes and pull requests scan only their new commits; the weekly run and
# manual runs scan the full history. Configuration: .gitleaks.toml and
# .gitleaksignore (reviewed findings in existing history).

on:
  pull_request:
  push:
    branches:
      - "**"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz
          gitleaks version

      - name: Scan new commits
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            LOG_OPTS="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            LOG_OPTS="$BEFORE..$AFTER"
          else
            # New branch or rewritten history: scan commits that no other branch has.
            OTHERS=$(git for-each-ref --format='%(refname)' refs/remotes/origin | grep -vx "refs/remotes/origin/$REF_NAME" | tr '\n' ' ')
            LOG_OPTS="$AFTER --not $OTHERS"
          fi
          echo "Scanning: $LOG_OPTS"
          gitleaks git --redact --no-banner --log-opts="$LOG_OPTS" .

      - name: Scan full history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: gitleaks git --redact --no-banner .
